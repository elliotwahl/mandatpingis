[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Inget byggkommando: public/index.html genereras lokalt med
#   python3 hamta_data.py && python3 bygg.py
# och checkas in. Netlify har ingen tillgång till mandatmarginal-projektets
# sparade råfiler, så den inbakade historiken kan bara byggas här.
#
# Siffrorna på sidan är däremot live: /api/data hämtar Valmyndigheten vid varje
# anrop, eftersom resultat.val.se inte skickar CORS-headers och webbläsaren
# därför inte får läsa källan direkt.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Sidan är en ögonblicksbild. Låt den inte ligga kvar länge i cache,
# annars visar en omladdning gammal räkning.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
